[package]
name = "jumppad"
version.workspace = true
edition.workspace = true
# Ambiguous otherwise: with two [[bin]] targets below, plain `cargo run`
# would refuse to guess which one to launch.
default-run = "jumppad"

[features]
default = ["tiny-skia"]
# Mutually exclusive per build - see the `jumppad`/`jumppad-gpu` bin entries
# below, each gated to the matching feature via `required-features`.
#
# On macOS specifically, `tiny-skia` (the default) can never honor
# `AlphaConfig::background < 1.0` (see `lib.rs`'s `transparent` local) - its
# compositor presents frames via `softbuffer`'s Core Graphics backend, which
# hardcodes `CGImageAlphaInfo::NoneSkipFirst` (softbuffer's
# `src/backends/cg.rs`), i.e. tells CG the buffer has no alpha channel at
# all. Whatever alpha `tiny-skia` painted into the buffer is discarded on
# presentation, unconditionally - the window renders fully opaque no matter
# what `config.toml` says, and because several separately alpha-scaled
# layers (window background, tab frame, tab bar filler - see
# `tab_frame_style`/`tab_bar_style` in `app.rs`) each get shown as their raw
# premultiplied RGB instead of being blended against the desktop, adjacent
# widgets can also show up as visibly different shades ("gaps") instead of a
# uniform translucent surface. `wgpu` drives a real `CAMetalLayer` on macOS
# instead and doesn't have this limitation - the fix for a user wanting
# transparency there is to build/run `jumppad-gpu`, not a code change here.
# `lib.rs`'s `OPAQUE_WINDOW_REASON` warns about this at startup. It is the
# only platform/backend pairing that cannot honor the config; Windows and
# Linux do transparency on both binaries.
tiny-skia = ["iced/tiny-skia"]
wgpu = ["iced/wgpu"]

[[bin]]
name = "jumppad"
path = "src/bin/jumppad.rs"
required-features = ["tiny-skia"]

[[bin]]
name = "jumppad-gpu"
path = "src/bin/jumppad-gpu.rs"
required-features = ["wgpu"]

[dependencies]
iced = { workspace = true, features = ["tokio"] }
editor_core.workspace = true
jumppad_textarea.workspace = true
syntax_registry.workspace = true
jumppad_config.workspace = true
jumppad_actions.workspace = true
jumppad_keybinds.workspace = true
jumppad_icons.workspace = true
notify = "8"
rfd = "0.15"
tokio = { version = "1", features = ["fs"] }
serde.workspace = true
toml.workspace = true
global-hotkey.workspace = true
display-info.workspace = true
env_logger = "0.11"
log = "0.4"

# Just enough Objective-C to reach the handful of AppKit calls that neither
# iced nor winit exposes - see `macos.rs`. This version is already in the tree
# via winit, so it costs nothing to build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# Same deal on Windows, for the `DwmSetWindowAttribute` calls - see `windows.rs`.
# winit already depends on this exact version with `Win32_Graphics_Dwm`
# enabled (it makes the same call for the attributes it *does* expose), so
# both features here are already on and this adds nothing to the build.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
