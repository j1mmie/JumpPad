[package]
name = "xizor"
version.workspace = true
edition.workspace = true
# Ambiguous otherwise: with two [[bin]] targets below, plain `cargo run`
# would refuse to guess which one to launch.
default-run = "xizor"

[features]
default = ["tiny-skia"]
# Mutually exclusive per build - see the `xizor`/`xizor-gpu` bin entries
# below, each gated to the matching feature via `required-features`.
#
# On macOS specifically, `tiny-skia` (the default) can never honor
# `AlphaConfig::background < 1.0` (see `lib.rs`'s `transparent` local) - its
# compositor presents frames via `softbuffer`'s Core Graphics backend, which
# hardcodes `CGImageAlphaInfo::NoneSkipFirst` (softbuffer's
# `src/backends/cg.rs`), i.e. tells CG the buffer has no alpha channel at
# all. Whatever alpha `tiny-skia` painted into the buffer is discarded on
# presentation, unconditionally - the window renders fully opaque no matter
# what `config.toml` says, and because several separately alpha-scaled
# layers (window background, tab frame, tab bar filler - see
# `tab_frame_style`/`tab_bar_style` in `app.rs`) each get shown as their raw
# premultiplied RGB instead of being blended against the desktop, adjacent
# widgets can also show up as visibly different shades ("gaps") instead of a
# uniform translucent surface. `wgpu` drives a real `CAMetalLayer` on macOS
# instead and doesn't have this limitation - the fix for a user wanting
# transparency there is to build/run `xizor-gpu`, not a code change here.
tiny-skia = ["iced/tiny-skia"]
wgpu = ["iced/wgpu"]

[[bin]]
name = "xizor"
path = "src/bin/xizor.rs"
required-features = ["tiny-skia"]

[[bin]]
name = "xizor-gpu"
path = "src/bin/xizor-gpu.rs"
required-features = ["wgpu"]

[dependencies]
iced = { workspace = true, features = ["tokio"] }
editor_core.workspace = true
iced_text_editor.workspace = true
syntax_registry.workspace = true
xizor_config.workspace = true
rfd = "0.15"
tokio = { version = "1", features = ["fs"] }
serde.workspace = true
toml.workspace = true
global-hotkey.workspace = true
display-info.workspace = true
env_logger = "0.11"
log = "0.4"
