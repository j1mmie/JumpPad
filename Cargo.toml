[workspace]
resolver = "2"
members = [
    "crates/editor_core",
    "crates/jumppad_textarea",
    "crates/syntax_registry",
    "crates/jumppad",
    "crates/jumppad_config",
    "crates/jumppad_actions",
    "crates/jumppad_keybinds",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# `wgpu`/`tiny-skia` (iced's two compositor backends) are deliberately left
# out of this shared default feature set. `jumppad`'s Cargo.toml picks exactly
# one of them per binary target (see `jumppad` and `jumppad-gpu` there) - if a
# library crate here requested one directly, Cargo's feature unification
# would compile both backends into every binary regardless of what the
# binary crate asked for, defeating the point of having two builds.
# `x11`/`wayland` are part of iced's own `default` feature set (as of 0.14,
# which split them out so a Linux build can pick just one) - `x11`/`wayland`
# have to be requested explicitly here since `default-features = false`
# above turns them off along with everything else.
# `fira-sans` is deliberately left off. It embeds a 440KB copy of Fira Sans
# in every binary, and nothing here ever asks for that family by name: the
# UI's `Font::DEFAULT` and the editor's `Font::MONOSPACE` are both generic
# families, resolved against the fonts the machine already has. The embedded
# copy is carried and never drawn.
iced = { version = "0.14", default-features = false, features = ["x11", "wayland"] }
# Only needed by `jumppad_config`, to convert `global-hotkey`/`keyboard-types`
# key-chord config into iced-native `keyboard::{Modifiers, key::Code}` in one
# place. `iced_core` is the crate that actually defines those types, with
# none of `iced`'s winit/wgpu/rendering weight - appropriate for a
# config-parsing crate that has no GUI of its own.
iced_core = "0.14"
tree-sitter = { version = "0.26", features = ["wasm"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
global-hotkey = { version = "0.8", features = ["serde"] }
display-info = "0.5"
editor_core = { path = "crates/editor_core" }
jumppad_textarea = { path = "crates/jumppad_textarea" }
syntax_registry = { path = "crates/syntax_registry" }
jumppad_config = { path = "crates/jumppad_config" }
jumppad_actions = { path = "crates/jumppad_actions" }
jumppad_keybinds = { path = "crates/jumppad_keybinds" }

# `iced_graphics` 0.14.0 plus one additive method, `Editor::scroll_by(pixels)`,
# which is what makes scrolling pixel-granular rather than line-snapped (see
# AGENTS.md). Branched from the `0.14.0` tag, not `master`: master is
# `0.15.0-dev`, and a patch has to keep satisfying the `^0.14` requirements
# every other iced crate states, or Cargo refuses it.
#
# Only this one crate is patched. `iced_core`'s `Action::Scroll` keeps its
# `i32`, so `iced_widget`, `iced_wgpu`, `iced_tiny_skia` and `iced` itself all
# stay on crates.io untouched. Widening `Action::Scroll` instead would have
# dragged `iced_widget` into the patch set, and that cannot work here - the
# `0.14.0` tag has it at 0.14.0 while crates.io ships 0.14.2.
#
# `iced_core` and `iced_futures` are patched only to keep the graph from
# splitting. `iced_graphics` depends on its workspace siblings by *path*, so
# patching it alone pulls a second `iced_core` out of the fork and leaves the
# registry copy in place for everything else - two `iced_core::Font` types
# that don't unify, and a wall of "expected X, found X". They carry no changes
# of ours; they are byte-identical to the 0.14.0 tag.
[patch.crates-io]
# `softbuffer` 0.4.8 with its CoreGraphics backend recycling frame buffers
# instead of allocating a fresh zeroed one per frame - 8MB and ~528 page
# faults per frame at a Retina window size. That also makes an honest
# `Buffer::age` possible, which is what would let `iced_tiny_skia` repaint
# only what changed; upstream hardcodes `age() -> 0`, so it repaints the whole
# window every frame. See AGENTS.md, including why the age half is currently
# switched off.
#
# Branched from the `v0.4.8` release commit, not `master`, for the same reason
# `iced_graphics` below is branched from its tag: a patch has to keep
# satisfying the `^0.4` requirement `iced_tiny_skia` states, or Cargo refuses
# it. `src/backends/cg.rs` is the only file that differs, so every other
# platform compiles upstream's code untouched.
softbuffer = { git = "https://github.com/j1mmie/softbuffer", branch = "jumppad/buffer-pool" }
iced_graphics = { git = "https://github.com/j1mmie/iced", branch = "jumppad/fractional-scroll" }
iced_core = { git = "https://github.com/j1mmie/iced", branch = "jumppad/fractional-scroll" }
iced_futures = { git = "https://github.com/j1mmie/iced", branch = "jumppad/fractional-scroll" }

[profile.release]
strip = true
panic = "abort"
lto = true
codegen-units = 1 # Slower, but better planned builds
opt-level = "z" # "z" for binary size, "s" to favor runtime speed

# "z" makes the build smaller, but it makes the software renderer slow. So we
# don't apply it to the crates that draw every frame. See AGENTS.md.
[profile.release.package]
tiny-skia = { opt-level = 3 }
tiny-skia-path = { opt-level = 3 }
bytemuck = { opt-level = 3 }
iced_tiny_skia = { opt-level = 3 }
iced_graphics = { opt-level = 3 }
cosmic-text = { opt-level = 3 }
swash = { opt-level = 3 }
zeno = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
