[workspace]
resolver = "2"
members = [
    "crates/editor_core",
    "crates/jumppad_textarea",
    "crates/syntax_registry",
    "crates/jumppad",
    "crates/jumppad_config",
    "crates/jumppad_actions",
    "crates/jumppad_keybinds",
    "crates/jumppad_icons",
    "crates/icon_font_builder",
]

# `icon_font_builder` is left out so a plain `cargo build`, `cargo test` or
# `cargo clippy` never compiles it. It is a build tool run by hand through
# `cargo build_fonts`, its output is committed, and its dependencies -
# an SVG parser, a curve library, a font writer - have no business being
# built as part of the app. `cargo build -p icon_font_builder` still works
# when someone wants exactly that.
default-members = [
    "crates/editor_core",
    "crates/jumppad_textarea",
    "crates/syntax_registry",
    "crates/jumppad",
    "crates/jumppad_config",
    "crates/jumppad_actions",
    "crates/jumppad_keybinds",
    "crates/jumppad_icons",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# `wgpu`/`tiny-skia` (iced's two compositor backends) are deliberately left
# out of this shared default feature set. `jumppad`'s Cargo.toml picks exactly
# one of them per binary target (see `jumppad` and `jumppad-gpu` there) - if a
# library crate here requested one directly, Cargo's feature unification
# would compile both backends into every binary regardless of what the
# binary crate asked for, defeating the point of having two builds.
# `x11`/`wayland` are part of iced's own `default` feature set (as of 0.14,
# which split them out so a Linux build can pick just one) - `x11`/`wayland`
# have to be requested explicitly here since `default-features = false`
# above turns them off along with everything else.
# `linux-theme-detection` is in that same default set, and is what lets
# `[mode] detection = "auto"` work on Linux: macOS and Windows report their
# light/dark setting through winit, which iced always listens to, but no such
# window event exists on Linux - the feature reads the XDG desktop portal
# instead.
# `fira-sans` is deliberately left off. It embeds a 440KB copy of Fira Sans
# in every binary, and nothing here ever asks for that family by name: the
# UI's `Font::DEFAULT` and the editor's `Font::MONOSPACE` are both generic
# families, resolved against the fonts the machine already has. The embedded
# copy is carried and never drawn.
iced = { version = "0.14", default-features = false, features = ["x11", "wayland", "linux-theme-detection"] }
# Only needed by `jumppad_config`, to convert `global-hotkey`/`keyboard-types`
# key-chord config into iced-native `keyboard::{Modifiers, key::Code}` in one
# place. `iced_core` is the crate that actually defines those types, with
# none of `iced`'s winit/wgpu/rendering weight - appropriate for a
# config-parsing crate that has no GUI of its own.
iced_core = "0.14"
tree-sitter = { version = "0.26", features = ["wasm"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Shared rather than per-crate because every crate that has something to say
# now says it through `log`, and only `jumppad` decides whether anyone is
# listening - see `crates/jumppad/src/debug.rs`. The facade costs a relaxed
# atomic load per call site while no logger is installed, which is the case
# for every run that didn't ask for one.
log = "0.4"
global-hotkey = { version = "0.8", features = ["serde"] }
display-info = "0.5"
editor_core = { path = "crates/editor_core" }
jumppad_textarea = { path = "crates/jumppad_textarea" }
syntax_registry = { path = "crates/syntax_registry" }
jumppad_config = { path = "crates/jumppad_config" }
jumppad_actions = { path = "crates/jumppad_actions" }
jumppad_keybinds = { path = "crates/jumppad_keybinds" }
jumppad_icons = { path = "crates/jumppad_icons" }

# `iced_graphics` 0.14.0 plus two additive methods on the concrete
# `graphics::text::Editor`: `scroll_by(pixels)`, which makes scrolling
# pixel-granular rather than line-snapped, and `set_tab_width(width)`, which
# is the only way up to the cosmic-text buffer's tab stops - `buffer()` hands
# out a shared reference (see AGENTS.md). Branched from the `0.14.0` tag,
# not `master`: master is
# `0.15.0-dev`, and a patch has to keep satisfying the `^0.14` requirements
# every other iced crate states, or Cargo refuses it.
#
# Only this one crate is patched. `iced_core`'s `Action::Scroll` keeps its
# `i32`, so `iced_widget`, `iced_wgpu`, `iced_tiny_skia` and `iced` itself all
# stay on crates.io untouched. Widening `Action::Scroll` instead would have
# dragged `iced_widget` into the patch set, and that cannot work here - the
# `0.14.0` tag has it at 0.14.0 while crates.io ships 0.14.2.
#
# `iced_core` and `iced_futures` are patched only to keep the graph from
# splitting. `iced_graphics` depends on its workspace siblings by *path*, so
# patching it alone pulls a second `iced_core` out of the fork and leaves the
# registry copy in place for everything else - two `iced_core::Font` types
# that don't unify, and a wall of "expected X, found X". They carry no changes
# of ours; they are byte-identical to the 0.14.0 tag.
[patch.crates-io]
# `softbuffer` 0.4.8 with its CoreGraphics backend recycling frame buffers
# instead of allocating a fresh zeroed one per frame - 8MB and ~528 page
# faults per frame at a Retina window size. That also makes an honest
# `Buffer::age` possible, which is what would let `iced_tiny_skia` repaint
# only what changed; upstream hardcodes `age() -> 0`, so it repaints the whole
# window every frame. See AGENTS.md, including why the age half is currently
# switched off.
#
# Branched from the `v0.4.8` release commit, not `master`, for the same reason
# `iced_graphics` below is branched from its tag: a patch has to keep
# satisfying the `^0.4` requirement `iced_tiny_skia` states, or Cargo refuses
# it. `src/backends/cg.rs` is the only file that differs, so every other
# platform compiles upstream's code untouched.
softbuffer = { git = "https://github.com/j1mmie/softbuffer", branch = "jumppad/buffer-pool" }
iced_graphics = { git = "https://github.com/j1mmie/iced", branch = "jumppad/fractional-scroll" }
iced_core = { git = "https://github.com/j1mmie/iced", branch = "jumppad/fractional-scroll" }
iced_futures = { git = "https://github.com/j1mmie/iced", branch = "jumppad/fractional-scroll" }

[profile.release]
strip = true
panic = "abort"
lto = true
codegen-units = 1 # Slower, but better planned builds
opt-level = "z" # "z" for binary size, "s" to favor runtime speed

# "z" makes the build smaller, but it makes a renderer slow. So we don't apply
# it to the crates that draw every frame - on *either* backend. See AGENTS.md.
[profile.release.package]
# Shared by both binaries: text shaping and iced's own geometry.
bytemuck = { opt-level = 3 }
iced_graphics = { opt-level = 3 }
cosmic-text = { opt-level = 3 }
swash = { opt-level = 3 }
zeno = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

# `jumppad`'s software rasterizer.
tiny-skia = { opt-level = 3 }
tiny-skia-path = { opt-level = 3 }
iced_tiny_skia = { opt-level = 3 }

# `jumppad-gpu`'s. These were missed when the list above was written, and the
# omission reads as "the hardware binary is slower than the software one",
# which is not a sentence anyone expects to be true. A GPU renderer still
# spends CPU per frame, and wgpu spends a lot of it: `wgpu-core`'s resource
# tracker and validation walk every buffer, bind group and draw call on the
# way to the driver, and `cryoglyph` re-packs the glyph atlas as text scrolls.
# All of it is small generic functions calling small generic functions -
# exactly the shape `-Oz` declines to inline - so this half of the app paid
# the whole per-frame cost with none of the optimization the software half
# had been given, against a `tiny-skia` that had been measured at 3.4x on
# this same setting.
#
# `naga` is here for startup rather than per-frame: it compiles iced's shaders
# once, when the compositor is built.
#
# This costs binary size, and more of it than the software list does - the
# wgpu stack is much larger than tiny-skia. It buys back the reason the GPU
# binary exists, and only `jumppad-gpu` links any of it, so `jumppad` is
# unchanged.
wgpu = { opt-level = 3 }
wgpu-core = { opt-level = 3 }
wgpu-hal = { opt-level = 3 }
wgpu-types = { opt-level = 3 }
iced_wgpu = { opt-level = 3 }
cryoglyph = { opt-level = 3 }
etagere = { opt-level = 3 }
guillotiere = { opt-level = 3 }
glam = { opt-level = 3 }
naga = { opt-level = 3 }

# Cranelift is the other place "z" costs more than it saves. It compiles
# every `.wasm` grammar at startup, so its speed is a startup cost, and its
# egraph pass recurses over a function's whole value graph - built without
# inlining, those frames are what pushed the loader thread off the end of its
# stack (see `LOAD_STACK_SIZE` in `syntax_registry`). Shallower frames and a
# faster load for the same reason.
cranelift-codegen = { opt-level = 3 }
cranelift-frontend = { opt-level = 3 }
cranelift-bforest = { opt-level = 3 }
cranelift-entity = { opt-level = 3 }
cranelift-bitset = { opt-level = 3 }
regalloc2 = { opt-level = 3 }
