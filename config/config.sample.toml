# Sample config file

# A colorway is just colors - one of iced's built-in palettes:
#   Light, Dark, Dracula, Nord, Solarized Light, Solarized Dark,
#   Gruvbox Light, Gruvbox Dark, Catppuccin Latte, Catppuccin Frappé,
#   Catppuccin Macchiato, Catppuccin Mocha, Tokyo Night, Tokyo Night Storm,
#   Tokyo Night Light, Kanagawa Wave, Kanagawa Dragon, Kanagawa Lotus,
#   Moonfly, Nightfly, Oxocarbon, Ferra
#
# A theme is JumpPad's: a colorway plus the alpha and fonts that go with it.
# Every property is optional - what you leave out is the default.

[mode]
# "auto" follows the OS while JumpPad runs. "light" or "dark" pins one slot.
detection = "auto"
light_theme = "jimmie_light"
dark_theme = "jimmie_dark"
# A name with no [themes] entry behind it is read as a colorway on the
# default theme, so picking colors needs no theme of its own:
# dark_theme = "Dracula"

[themes.jimmie_dark]
colorway = "Dark"
alpha.background = 0.925
alpha.foreground = 1.0
fonts.editor.family = "MesloLGS NF"
# fonts.editor.family = "CaskaydiaMono Nerd Font Mono"
# fonts.editor.family = "Menlo"
fonts.editor.size = 16.0
fonts.ui.family = "Arial Black"
# fonts.ui.family = "Lucida Grande"
# fonts.ui.size = 16.0

[themes.jimmie_light]
colorway = "Light"
fonts.editor.family = "MesloLGS NF"
fonts.ui.family = "Arial Black"

[window]
decorations = true

[visor]
enabled = false

[scroll]
sensitivity = 0.5

[files]
save_conflict_resolution = "ask"

[[languages]]
name = "Markdown"
syntax = "markdown"
extensions = ["md", "markdown", "mdown", "mkdn", "mkd", "mdwn", "mdtxt", "mdtext"]

[[languages]]
name = "YAML"
syntax = "yaml"
extensions = ["yaml", "yml"]
comment.single = "# "

[[languages]]
name = "TOML"
syntax = "toml"
extensions = ["toml", "tml"]
comment.single = "# "

[[languages]]
name = "JSON"
syntax = "json"
extensions = ["json"]

[[languages]]
name = "JSONC"
syntax = "json"
extensions = [ "jsonc" ]
comment.multi.left = "/*"
comment.multi.right = "*/"

[[languages]]
name = "XML"
syntax = "xml"
extensions = ["xml", "xsl", "xsd", "svg"]
comment.multi.left = "<!--"
comment.multi.right = "-->"

[[languages]]
name = "HTML"
syntax = "html"
extensions = ["htm", "html", "xhtml"]
comment.multi.left = "<!--"
comment.multi.right = "-->"

[[languages]]
name = "DTD"
syntax = "dtd"
extensions = ["dtd"]
comment.multi.left = "<!--"
comment.multi.right = "-->"
