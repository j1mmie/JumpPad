# Sample config file

# A palette is a set of colors that can be used in a theme. JumpPad comes with
# a few palettes built-in:
#   Light, Dark, Dracula, Nord, Solarized Light, Solarized Dark,
#   Gruvbox Light, Gruvbox Dark, Catppuccin Latte, Catppuccin Frappé,
#   Catppuccin Macchiato, Catppuccin Mocha, Tokyo Night, Tokyo Night Storm,
#   Tokyo Night Light, Kanagawa Wave, Kanagawa Dragon, Kanagawa Lotus,
#   Moonfly, Nightfly, Oxocarbon, Ferra
#

# `base` is the theme every other theme inherits from, property by property.
# What a theme below doesn't name comes from here; what neither names is
# JumpPad's own default.

[themes.base]
palette = "Ferra"
background.alpha = 0.925
foreground.alpha = 1.0
# Frosts what shows through the window instead of leaving the desktop sharp.
# Each platform reads only the forms it can act on; everything else is "none".
#
#   "none"             no blur. The default, and what 0 also means.
#   24                 macOS only: the blur radius. Values up to 64 are
#                      reasonable, higher ones get slow before they get any
#                      blurrier. Windows has no radius, and reads a number
#                      as "none".
#   "acrylic10"        Windows only: its standard acrylic. Windows stops
#                      drawing it while the window is not focused - that is
#                      the OS's own rule for this material, not a setting.
#   "acrylic11"        Windows only: the acrylic that keeps frosting an
#                      unfocused window. Through an undocumented API, so
#                      expect lag while dragging or resizing the window, and
#                      the frost to drop out mid-maximize. Nothing reaches
#                      for that API unless a theme names this.
#
# There is nothing to see at `background.alpha = 1.0`, where no desktop shows
# through to frost, and the alpha is what varies the strength: the theme's
# background color is painted over the frost, so a lower alpha shows more of
# it. Expect the blur on `jumppad-gpu` - the software binary reaches the
# screen by a different path on both platforms, and on macOS that path cannot
# draw a see-through window in the first place.
background.blur = "none"
editor.font.family = "Consolas"
editor.font.size = 16.0
ui.font.family = "Comic Sans MS"

# The two slots show `light` and `dark` unless `[mode]` names something else,
# so themes named after the slots they fill need no `[mode] theme` lines.

[themes.dark]
palette = "Tokyo Night"

[themes.light]
palette = "Solarized Light"
background.alpha = 1.0

[mode]
# "auto" follows the OS; "light" or "dark" pins one slot.
detection = "auto"

[window]
decorations = true

# Read only by `jumppad-gpu`. The software binary has no adapter to choose
# and no swapchain to wait on, and ignores both of these.
[gpu]
# "high" is the discrete card, "low" the integrated one, "auto" states no
# preference. On Windows the adapter is what decides whether the window can
# be translucent at all, so if you set "low", check that `background.alpha`
# still does something before keeping it.
power = "high"
# Whether a frame waits for the display before it is shown. Off, because
# waiting costs about two refreshes between moving the mouse and seeing the
# selection follow it, and a window your desktop compositor draws cannot
# tear without it. Turn it on if you ever see a frame torn in half.
vsync = false

[visor]
enabled = false

[scroll]
# Multipliers on the shipped speed: 2.0 is twice as fast, 0.5 half.
# `sensitivity` is the wheel and trackpad; `drag_speed` is how fast the view
# scrolls while a selection is dragged past the top or bottom edge.
sensitivity = 0.5
drag_speed = 1.0

[files]
save_conflict_resolution = "ask"

[words]
# What ends a word, for Ctrl/Option+Left and Right and for the double click
# that selects one. The whole list is replaced, not added to, and whitespace
# always ends a word whether or not it is named here.
#
# The default is VS Code's own `editor.wordSeparators`:
#   "`~!@#$%^&*()-=+[{]}\\|;:'\",.<>/?"
# This one takes `-` out of it, so `font-size` reads as one word rather than
# three.
separators = "`~!@#$%^&*()=+[{]}\\|;:'\",.<>/?"

[indentation]
# "tabs" inserts one tab character; "spaces" inserts however many spaces
# reach the next stop from where the caret is. `width` is the columns
# between stops either way, and is also how wide a tab is drawn - so a file
# full of tabs lines up at this width whichever style is set.
style = "spaces"
width = 2

# Languages ship as bundles: `syntaxes/<grammar>/config.toml` names a
# language's extensions, comment style and code-fence aliases, and the
# `syntax.wasm` beside it highlights them. Nothing below is needed to get
# highlighting - these are only here to show what overriding one looks like.
#
# An entry is matched to a bundle by `name`, ignoring case, and changes only
# the settings it names. Everything it leaves out stays as the bundle shipped
# it, so this adds two extensions to YAML without disturbing its comment
# style or its grammar.

[[languages]]
name = "YAML"
extensions = ["yaml", "yml", "sls", "eyaml"]

# A list replaces the bundle's rather than adding to it, so naming
# `extensions` here means these are now the only Markdown extensions.

[[languages]]
name = "Markdown"
extensions = ["md", "markdown"]

# `aliases` are the names a Markdown code fence can call a language by, on
# top of its grammar name and its extensions - ```rs and ```py already work.

[[languages]]
name = "Python"
aliases = ["python3", "sage"]

# A name no bundle claims is a language of its own. It needs `extensions` to
# be worth anything, and a `syntax` naming a bundle if it wants highlighting -
# without one it still gets comment toggling.

[[languages]]
name = "INI"
extensions = ["ini", "cfg"]
comment.single = "; "
