# Sample config file

# A palette is a set of colors that can be used in a theme. JumpPad comes with
# a few palettes built-in:
#   Light, Dark, Dracula, Nord, Solarized Light, Solarized Dark,
#   Gruvbox Light, Gruvbox Dark, Catppuccin Latte, Catppuccin Frappé,
#   Catppuccin Macchiato, Catppuccin Mocha, Tokyo Night, Tokyo Night Storm,
#   Tokyo Night Light, Kanagawa Wave, Kanagawa Dragon, Kanagawa Lotus,
#   Moonfly, Nightfly, Oxocarbon, Ferra
#

# `base` is the theme every other theme inherits from, property by property.
# What a theme below doesn't name comes from here; what neither names is
# JumpPad's own default.

[themes.base]
palette = "Ferra"
background.alpha = 0.925
foreground.alpha = 1.0
editor.font.family = "Consolas"
editor.font.size = 16.0
ui.font.family = "Comic Sans MS"

# The two slots show `light` and `dark` unless `[mode]` names something else,
# so themes named after the slots they fill need no `[mode] theme` lines.

[themes.dark]
palette = "Tokyo Night"

[themes.light]
palette = "Solarized Light"
background.alpha = 1.0

[mode]
# "auto" follows the OS; "light" or "dark" pins one slot.
detection = "auto"

[window]
decorations = true

[visor]
enabled = false

[scroll]
sensitivity = 0.5

[files]
save_conflict_resolution = "ask"

[[languages]]
name = "Markdown"
syntax = "markdown"
extensions = ["md", "markdown", "mdown", "mkdn", "mkd", "mdwn", "mdtxt", "mdtext"]

[[languages]]
name = "YAML"
syntax = "yaml"
extensions = ["yaml", "yml"]
comment.single = "# "

[[languages]]
name = "TOML"
syntax = "toml"
extensions = ["toml", "tml"]
comment.single = "# "

[[languages]]
name = "JSON"
syntax = "json"
extensions = ["json"]

[[languages]]
name = "JSONC"
syntax = "json"
extensions = [ "jsonc" ]
comment.multi.left = "/*"
comment.multi.right = "*/"

[[languages]]
name = "XML"
syntax = "xml"
extensions = ["xml", "xsl", "xsd", "svg"]
comment.multi.left = "<!--"
comment.multi.right = "-->"

[[languages]]
name = "HTML"
syntax = "html"
extensions = ["htm", "html", "xhtml"]
comment.multi.left = "<!--"
comment.multi.right = "-->"

[[languages]]
name = "DTD"
syntax = "dtd"
extensions = ["dtd"]
comment.multi.left = "<!--"
comment.multi.right = "-->"
