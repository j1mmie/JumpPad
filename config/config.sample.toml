# Sample config file

# Valid Themes: Light, Dark, Dracula, Nord, Solarized Light, Solarized Dark,
#               Gruvbox Light, Gruvbox Dark, Catppuccin Latte, Catppuccin Frappé,
#               Catppuccin Macchiato, Catppuccin Mocha, Tokyo Night, Tokyo Night Storm,
#               Tokyo Night Light, Kanagawa Wave, Kanagawa Dragon, Kanagawa Lotus,
#               Moonfly, Nightfly, Oxocarbon, Ferra

theme = "Tokyo Night Storm"
# theme = "Light"

[alpha]
background = 0.925
foreground = 1.0

[window]
decorations = true

[visor]
enabled = false

[scroll]
sensitivity = 1.0

[files]
save_conflict_resolution = "ask"

[font.editor]
# family = "JetBrains Mono"
size = 16.0

[font.ui]
# family = "Inter"
size = 16.0

[[languages]]
name = "Markdown"
syntax = "markdown"
extensions = ["md", "markdown", "mdown", "mkdn", "mkd", "mdwn", "mdtxt", "mdtext"]

[[languages]]
name = "YAML"
syntax = "yaml"
extensions = ["yaml", "yml"]
comment.single = "# "

[[languages]]
name = "TOML"
syntax = "toml"
extensions = ["toml", "tml"]
comment.single = "# "

[[languages]]
name = "JSON"
syntax = "json"
extensions = ["json"]

[[languages]]
name = "JSONC"
syntax = "json"
extensions = [ "jsonc" ]
comment.multi.left = "/*"
comment.multi.right = "*/"

[[languages]]
name = "XML"
syntax = "xml"
extensions = ["xml", "xsl", "xsd", "svg"]
comment.multi.left = "<!--"
comment.multi.right = "-->"

[[languages]]
name = "HTML"
syntax = "html"
extensions = ["htm", "html", "xhtml"]
comment.multi.left = "<!--"
comment.multi.right = "-->"

[[languages]]
name = "DTD"
syntax = "dtd"
extensions = ["dtd"]
comment.multi.left = "<!--"
comment.multi.right = "-->"
