# Sample config file

# Valid Themes: Light, Dark, Dracula, Nord, Solarized Light, Solarized Dark,
#               Gruvbox Light, Gruvbox Dark, Catppuccin Latte, Catppuccin Frappé,
#               Catppuccin Macchiato, Catppuccin Mocha, Tokyo Night, Tokyo Night Storm,
#               Tokyo Night Light, Kanagawa Wave, Kanagawa Dragon, Kanagawa Lotus,
#               Moonfly, Nightfly, Oxocarbon, Ferra

theme = "Tokyo Night Storm"
# theme = "Light"

[alpha]
background = 0.925
foreground = 1.0

[window]
decorations = true

[visor]
enabled = false

[scroll]
# Multiplier on how far the mouse wheel and trackpad scroll the document.
# 1.0 is the shipped speed; 2.0 is twice as far per notch, 0.5 half.
# Clamped to 0.05..=20.0, so a typo slows the wheel down rather than
# breaking it. Applies live - no restart needed.
sensitivity = 1.0

[files]
# What a save does when the file changed on disk after JumpPad read it.
# "ask" prompts before overwriting someone else's changes; "overwrite"
# skips the check and always writes. Applies live - no restart needed.
save_conflict_resolution = "ask"

# Each [[languages]] entry maps file extensions to a syntax (its .wasm
# grammar) and a toggle-comment style. Replaces the built-in list wholesale.

[[languages]]
name = "Markdown"
syntax = "markdown"
extensions = ["md", "markdown", "mdown", "mkdn", "mkd", "mdwn", "mdtxt", "mdtext"]

[[languages]]
name = "YAML"
syntax = "yaml"
extensions = ["yaml", "yml"]
comment.single = "# "

[[languages]]
name = "TOML"
syntax = "toml"
extensions = ["toml", "tml"]
comment.single = "# "

[[languages]]
name = "JSON"
syntax = "json"
extensions = ["json"]

[[languages]]
name = "JSONC"
syntax = "json"
extensions = [ "jsonc" ]
comment.multi.left = "/*"
comment.multi.right = "*/"

[[languages]]
name = "XML"
syntax = "xml"
extensions = ["xml", "xsl", "xsd", "svg"]
comment.multi.left = "<!--"
comment.multi.right = "-->"

[[languages]]
name = "HTML"
syntax = "html"
extensions = ["htm", "html", "xhtml"]
comment.multi.left = "<!--"
comment.multi.right = "-->"

[[languages]]
name = "DTD"
syntax = "dtd"
extensions = ["dtd"]
comment.multi.left = "<!--"
comment.multi.right = "-->"
