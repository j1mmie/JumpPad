# Sample config file

# A palette is just colors - one of iced's built-in palettes:
#   Light, Dark, Dracula, Nord, Solarized Light, Solarized Dark,
#   Gruvbox Light, Gruvbox Dark, Catppuccin Latte, Catppuccin Frappé,
#   Catppuccin Macchiato, Catppuccin Mocha, Tokyo Night, Tokyo Night Storm,
#   Tokyo Night Light, Kanagawa Wave, Kanagawa Dragon, Kanagawa Lotus,
#   Moonfly, Nightfly, Oxocarbon, Ferra
#
# A theme is JumpPad's: a palette plus the alpha and fonts that go with it.
# Every property is optional - what you leave out is the default.

[mode]
# "auto" follows the OS while JumpPad runs. "light" or "dark" pins one slot.
detection = "auto"
theme.light = "jimmie_light"
theme.dark = "jimmie_dark"
# A name with no [themes] entry behind it is read as a palette on the
# default theme, so picking colors needs no theme of its own:
# theme.dark = "Dracula"

[themes.jimmie_dark]
palette = "Dark"
background.alpha = 0.925
foreground.alpha = 1.0
editor.font.family = "MesloLGS NF"
# editor.font.family = "CaskaydiaMono Nerd Font Mono"
# editor.font.family = "Menlo"
editor.font.size = 16.0
ui.font.family = "Arial Black"
# ui.font.family = "Lucida Grande"
# ui.font.size = 16.0

[themes.jimmie_light]
palette = "Light"
editor.font.family = "MesloLGS NF"
ui.font.family = "Arial Black"

[window]
decorations = true

[visor]
enabled = false

[scroll]
sensitivity = 0.5

[files]
save_conflict_resolution = "ask"

[[languages]]
name = "Markdown"
syntax = "markdown"
extensions = ["md", "markdown", "mdown", "mkdn", "mkd", "mdwn", "mdtxt", "mdtext"]

[[languages]]
name = "YAML"
syntax = "yaml"
extensions = ["yaml", "yml"]
comment.single = "# "

[[languages]]
name = "TOML"
syntax = "toml"
extensions = ["toml", "tml"]
comment.single = "# "

[[languages]]
name = "JSON"
syntax = "json"
extensions = ["json"]

[[languages]]
name = "JSONC"
syntax = "json"
extensions = [ "jsonc" ]
comment.multi.left = "/*"
comment.multi.right = "*/"

[[languages]]
name = "XML"
syntax = "xml"
extensions = ["xml", "xsl", "xsd", "svg"]
comment.multi.left = "<!--"
comment.multi.right = "-->"

[[languages]]
name = "HTML"
syntax = "html"
extensions = ["htm", "html", "xhtml"]
comment.multi.left = "<!--"
comment.multi.right = "-->"

[[languages]]
name = "DTD"
syntax = "dtd"
extensions = ["dtd"]
comment.multi.left = "<!--"
comment.multi.right = "-->"
