# Sample config file

# Valid Themes: Light, Dark, Dracula, Nord, Solarized Light, Solarized Dark,
#               Gruvbox Light, Gruvbox Dark, Catppuccin Latte, Catppuccin Frappé,
#               Catppuccin Macchiato, Catppuccin Mocha, Tokyo Night, Tokyo Night Storm,
#               Tokyo Night Light, Kanagawa Wave, Kanagawa Dragon, Kanagawa Lotus,
#               Moonfly, Nightfly, Oxocarbon, Ferra

theme = "Tokyo Night Storm"
# theme = "Light"

[alpha]
background = 0.925
foreground = 1.0

[window]
decorations = true

[visor]
enabled = false

[syntaxes]
markdown = ["md", "markdown", "mdown", "mkdn", "mkd", "mdwn", "mdtxt", "mdtext"]
yaml = ["yaml", "yml"]
toml = ["toml", "tml"]
json = ["json", "jsonc"]
xml = ["xml", "xsl", "xsd", "svg", "html", "htm", "xhtml"]
dtd = ["dtd"]

# Single-line comment styles for the toggle-comment command (Cmd+/ on macOS,
# Ctrl+/ elsewhere). `languages` are file extensions, no leading dot.
# Providing any [[comment_styles]] section replaces the built-in defaults
# wholesale; a file whose extension matches no style makes the command do
# nothing. Changes apply live, no restart needed.
#
# [[comment_styles]]
# languages = ["cpp", "js"]
# prefix = "// "
#
# [[comment_styles]]
# languages = ["sh", "toml"]
# prefix = "# "
