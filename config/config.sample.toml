# Sample config file

# A palette is a set of colors that can be used in a theme. JumpPad comes with
# a few palettes built-in:
#   Light, Dark, Dracula, Nord, Solarized Light, Solarized Dark,
#   Gruvbox Light, Gruvbox Dark, Catppuccin Latte, Catppuccin Frappé,
#   Catppuccin Macchiato, Catppuccin Mocha, Tokyo Night, Tokyo Night Storm,
#   Tokyo Night Light, Kanagawa Wave, Kanagawa Dragon, Kanagawa Lotus,
#   Moonfly, Nightfly, Oxocarbon, Ferra
#

[themes.jimmie_dark]
palette = "Dark"
background.alpha = 0.925
foreground.alpha = 1.0
editor.font.family = "Consolas"
editor.font.size = 16.0
ui.font.family = "Comic Sans MS"

[themes.jimmie_light]
palette = "Light"
editor.font.family = "Consolas"
ui.font.family = "Comic Sans MS"

[mode]
detection = "auto"
theme.light = "jimmie_light"
theme.dark = "jimmie_dark"

[window]
decorations = true

[visor]
enabled = false

[scroll]
sensitivity = 0.5

[files]
save_conflict_resolution = "ask"

[[languages]]
name = "Markdown"
syntax = "markdown"
extensions = ["md", "markdown", "mdown", "mkdn", "mkd", "mdwn", "mdtxt", "mdtext"]

[[languages]]
name = "YAML"
syntax = "yaml"
extensions = ["yaml", "yml"]
comment.single = "# "

[[languages]]
name = "TOML"
syntax = "toml"
extensions = ["toml", "tml"]
comment.single = "# "

[[languages]]
name = "JSON"
syntax = "json"
extensions = ["json"]

[[languages]]
name = "JSONC"
syntax = "json"
extensions = [ "jsonc" ]
comment.multi.left = "/*"
comment.multi.right = "*/"

[[languages]]
name = "XML"
syntax = "xml"
extensions = ["xml", "xsl", "xsd", "svg"]
comment.multi.left = "<!--"
comment.multi.right = "-->"

[[languages]]
name = "HTML"
syntax = "html"
extensions = ["htm", "html", "xhtml"]
comment.multi.left = "<!--"
comment.multi.right = "-->"

[[languages]]
name = "DTD"
syntax = "dtd"
extensions = ["dtd"]
comment.multi.left = "<!--"
comment.multi.right = "-->"
