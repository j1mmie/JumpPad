# Valid Themes: Light, Dark, Dracula, Nord, Solarized Light, Solarized Dark,
#               Gruvbox Light, Gruvbox Dark, Catppuccin Latte, Catppuccin Frappé,
#               Catppuccin Macchiato, Catppuccin Mocha, Tokyo Night, Tokyo Night Storm,
#               Tokyo Night Light, Kanagawa Wave, Kanagawa Dragon, Kanagawa Lotus,
#               Moonfly, Nightfly, Oxocarbon, Ferra

theme = "Kanagawa Wave"

[alpha]
# Independent transparency for the editor's background versus its text -
# 1.0 is fully solid, 0.0 fully invisible. Leaving background at 1.0 (the
# default) skips enabling OS-level window transparency entirely, avoiding
# any compositing overhead for the common case of not wanting this at all.
background = 0.7
foreground = 1.0

[visor]
# Drop-down "visor" mode: undecorated, always-on-top, hidden until summoned
# by the global toggle hotkey (see keybinds.toml). Still a bit buggy on some
# systems, so it's opt-in for now - leave this false for an ordinary window
# with the default OS titlebar/frame (the global toggle hotkey is ignored in
# that case).
enabled = false

[syntaxes]
markdown = ["md", "markdown", "mdown", "mkdn", "mkd", "mdwn", "mdtxt", "mdtext"]
yaml = ["yaml", "yml"]
toml = ["toml", "tml"]
json = ["json", "jsonc"]
xml = ["xml", "xsl", "xsd", "svg", "html", "htm", "xhtml"]
dtd = ["dtd"]
