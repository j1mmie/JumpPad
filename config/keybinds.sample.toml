toggle = "control+Backquote"

# Action-name -> key-chord overrides for JumpPad's in-app shortcuts. Takes
# precedence over the action's default chord when present. Uses the same chord
# format as `toggle` above (e.g. "control+alt+n", "cmd+shift+z"). Two different
# names mapping to the same chord is undefined-which-wins - not a supported
# configuration, just not guarded against.
#
# Every action is declared in one place, `crates/jumppad_actions/src/lib.rs`,
# and `sample_keybinds_document_every_action` keeps this list honest.
#
# Valid names:
#   Application:
#     new_tab, open_file, save_file, save_file_as, close_active_tab,
#     select_previous_tab, select_next_tab, select_previous_active_tab,
#     find, find_next, find_previous
#   Editor:
#     word_delete_backward, word_delete_forward, document_start,
#     select_document_start, document_end, select_document_end, undo, redo,
#     toggle_comment, delete_line, move_line_up, move_line_down,
#     copy_line_up, copy_line_down
#
# toggle_comment's default chord needs an unshifted `/` key; on layouts
# without one (e.g. German), bind it here - overrides match by physical key,
# while default chords match the character your layout produces.
#
# Example:
# [overrides]
# new_tab = "control+alt+n"
# undo = "control+z"
[overrides]
